<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Iyunga Technical Secondary School Admin Contact Messages">

    <title>
        Contact Messages | Iyunga Technical Secondary School
    </title>

    <link rel="stylesheet"
          href="assets/css/style.css">

    <style>

        /* =====================================================
           ADMIN PAGE
        ===================================================== */

        .admin-page {
            background: #f5f7f6;
            min-height: 100vh;
            padding: 50px 0;
        }


        .admin-header {
            background: #063b2f;
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }


        .admin-header h1 {
            margin-bottom: 8px;
        }


        .admin-header p {
            margin: 0;
            opacity: 0.9;
        }


        /* =====================================================
           STATISTICS
        ===================================================== */

        .message-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }


        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }


        .stat-card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }


        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #063b2f;
        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .messages-toolbar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }


        .messages-toolbar input {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }


        .refresh-btn {
            border: none;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 6px;
            background: #063b2f;
            color: white;
            font-size: 14px;
        }


        .refresh-btn:hover {
            background: #075c42;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .messages-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }


        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }


        .messages-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }


        .messages-table th {
            background: #063b2f;
            color: white;
            text-align: left;
            padding: 15px;
            font-size: 14px;
        }


        .messages-table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #444;
            vertical-align: top;
        }


        .messages-table tr:hover {
            background: #f8faf9;
        }


        .message-preview {
            max-width: 300px;
            line-height: 1.5;
        }


        .message-date {
            white-space: nowrap;
            font-size: 13px;
            color: #777;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }


        .error-message {
            background: #fff0f0;
            color: #a40000;
            border: 1px solid #f0b5b5;
            padding: 18px;
            border-radius: 6px;
            margin: 20px 0;
        }


        .empty-message {
            text-align: center;
            padding: 50px;
            color: #777;
        }


        /* =====================================================
           VIEW BUTTON
        ===================================================== */

        .view-btn {
            border: none;
            background: #063b2f;
            color: white;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }


        .view-btn:hover {
            background: #075c42;
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {
            display: none;

            position: fixed;
            z-index: 9999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.6);

            padding: 30px;

            overflow-y: auto;
        }


        .modal-content {
            background: white;

            max-width: 700px;

            margin: 50px auto;

            padding: 30px;

            border-radius: 10px;

            position: relative;
        }


        .modal-close {
            position: absolute;

            right: 20px;
            top: 15px;

            border: none;

            background: transparent;

            font-size: 28px;

            cursor: pointer;

            color: #555;
        }


        .modal-content h2 {
            color: #063b2f;
            margin-bottom: 20px;
            padding-right: 30px;
        }


        .message-detail {
            margin-bottom: 18px;
        }


        .message-detail strong {
            display: block;
            color: #063b2f;
            margin-bottom: 5px;
        }


        .message-detail p {
            margin: 0;
            color: #555;
            line-height: 1.6;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 768px) {

            .message-stats {
                grid-template-columns: 1fr;
            }


            .admin-page {
                padding: 25px 0;
            }


            .admin-header {
                padding: 22px;
            }


            .admin-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<section class="admin-page">

    <div class="container">


        <!-- HEADER -->

        <div class="admin-header">

            <h1>
                Contact Messages
            </h1>

            <p>
                Iyunga Technical Secondary School
                - Administration
            </p>

        </div>



        <!-- =================================================
             STATISTICS
        ================================================== -->

        <div class="message-stats">


            <div class="stat-card">

                <h3>
                    Total Messages
                </h3>

                <div class="stat-number"
                     id="totalMessages">

                    0

                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Latest Message ID
                </h3>

                <div class="stat-number"
                     id="latestMessage">

                    -

                </div>

            </div>


            <div class="stat-card">

                <h3>
                    System Status
                </h3>

                <div class="stat-number"
                     id="systemStatus"
                     style="font-size:20px;">

                    Checking...

                </div>

            </div>


        </div>



        <!-- =================================================
             TOOLBAR
        ================================================== -->

        <div class="messages-toolbar">


            <input
                type="search"
                id="searchInput"
                placeholder="Search by name, email or subject...">


            <button
                type="button"
                class="refresh-btn"
                id="refreshBtn">

                🔄 Refresh Messages

            </button>


        </div>



        <!-- =================================================
             MESSAGES
        ================================================== -->

        <div class="messages-container">

            <div id="loading"
                 class="loading">

                Loading messages...

            </div>


            <div id="errorMessage"
                 class="error-message"
                 style="display:none;">

            </div>


            <div id="emptyMessage"
                 class="empty-message"
                 style="display:none;">

                No contact messages found.

            </div>


            <div class="table-wrapper"
                 id="tableWrapper"
                 style="display:none;">

                <table class="messages-table">

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Subject
                            </th>

                            <th>
                                Message
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="messagesTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     VIEW MESSAGE MODAL
===================================================== -->

<div class="modal"
     id="messageModal">

    <div class="modal-content">


        <button
            type="button"
            class="modal-close"
            id="modalClose">

            &times;

        </button>


        <h2>
            Contact Message
        </h2>


        <div class="message-detail">

            <strong>
                Name
            </strong>

            <p id="modalName"></p>

        </div>


        <div class="message-detail">

            <strong>
                Email
            </strong>

            <p id="modalEmail"></p>

        </div>


        <div class="message-detail">

            <strong>
                Subject
            </strong>

            <p id="modalSubject"></p>

        </div>


        <div class="message-detail">

            <strong>
                Message
            </strong>

            <p id="modalMessage"></p>

        </div>


        <div class="message-detail">

            <strong>
                Date
            </strong>

            <p id="modalDate"></p>

        </div>


    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

    const API_URL =
        "http://localhost:8080/api/contact";


    let allMessages = [];



    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    async function loadMessages() {

        const loading =
            document.getElementById("loading");

        const errorMessage =
            document.getElementById("errorMessage");

        const emptyMessage =
            document.getElementById("emptyMessage");

        const tableWrapper =
            document.getElementById("tableWrapper");

        const systemStatus =
            document.getElementById("systemStatus");


        loading.style.display = "block";

        errorMessage.style.display = "none";

        emptyMessage.style.display = "none";

        tableWrapper.style.display = "none";


        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {

                throw new Error(
                    "Server returned HTTP status " +
                    response.status
                );

            }


            const data =
                await response.json();


            allMessages = data;


            systemStatus.textContent =
                "Online";


            displayMessages(allMessages);


        } catch (error) {

            console.error(
                "Error loading messages:",
                error
            );


            systemStatus.textContent =
                "Offline";


            errorMessage.textContent =
                "Unable to connect to the Spring Boot server. " +
                "Make sure your backend is running on port 8080.";


            errorMessage.style.display =
                "block";

        } finally {

            loading.style.display =
                "none";

        }

    }



    /* =====================================================
       DISPLAY MESSAGES
    ===================================================== */

    function displayMessages(messages) {

        const tableBody =
            document.getElementById(
                "messagesTableBody"
            );

        const tableWrapper =
            document.getElementById(
                "tableWrapper"
            );

        const emptyMessage =
            document.getElementById(
                "emptyMessage"
            );


        tableBody.innerHTML = "";


        if (!messages || messages.length === 0) {

            tableWrapper.style.display =
                "none";

            emptyMessage.style.display =
                "block";

            document.getElementById(
                "totalMessages"
            ).textContent = "0";

            document.getElementById(
                "latestMessage"
            ).textContent = "-";

            return;

        }


        /*
         * Newest messages first
         */

        const sortedMessages =
            [...messages].sort(
                (a, b) =>
                    Number(b.id) - Number(a.id)
            );


        document.getElementById(
            "totalMessages"
        ).textContent =
            sortedMessages.length;


        document.getElementById(
            "latestMessage"
        ).textContent =
            sortedMessages[0].id;


        sortedMessages.forEach(
            function (message) {

                const row =
                    document.createElement("tr");


                const date =
                    message.createdAt
                        ? new Date(
                            message.createdAt
                          ).toLocaleString()
                        : "-";


                row.innerHTML = `

                    <td>
                        ${escapeHtml(message.id)}
                    </td>

                    <td>
                        ${escapeHtml(message.name)}
                    </td>

                    <td>
                        ${escapeHtml(message.email)}
                    </td>

                    <td>
                        ${escapeHtml(message.subject)}
                    </td>

                    <td class="message-preview">
                        ${escapeHtml(
                            truncateMessage(
                                message.message,
                                80
                            )
                        )}
                    </td>

                    <td class="message-date">
                        ${escapeHtml(date)}
                    </td>

                    <td>

                        <button
                            type="button"
                            class="view-btn"
                            onclick="viewMessage(${message.id})">

                            View

                        </button>

                    </td>

                `;


                tableBody.appendChild(row);

            }
        );


        emptyMessage.style.display =
            "none";


        tableWrapper.style.display =
            "block";

    }



    /* =====================================================
       TRUNCATE MESSAGE
    ===================================================== */

    function truncateMessage(
        text,
        maxLength
    ) {

        if (!text) {
            return "";
        }


        if (text.length <= maxLength) {
            return text;
        }


        return text.substring(
            0,
            maxLength
        ) + "...";

    }



    /* =====================================================
       VIEW MESSAGE
    ===================================================== */

    function viewMessage(id) {

        const message =
            allMessages.find(
                item =>
                    Number(item.id) === Number(id)
            );


        if (!message) {
            return;
        }


        document.getElementById(
            "modalName"
        ).textContent =
            message.name || "-";


        document.getElementById(
            "modalEmail"
        ).textContent =
            message.email || "-";


        document.getElementById(
            "modalSubject"
        ).textContent =
            message.subject || "-";


        document.getElementById(
            "modalMessage"
        ).textContent =
            message.message || "-";


        document.getElementById(
            "modalDate"
        ).textContent =
            message.createdAt
                ? new Date(
                    message.createdAt
                  ).toLocaleString()
                : "-";


        document.getElementById(
            "messageModal"
        ).style.display =
            "block";

    }



    /* =====================================================
       CLOSE MODAL
    ===================================================== */

    document.getElementById(
        "modalClose"
    ).addEventListener(
        "click",
        function () {

            document.getElementById(
                "messageModal"
            ).style.display =
                "none";

        }
    );



    /* =====================================================
       CLOSE MODAL OUTSIDE
    ===================================================== */

    window.addEventListener(
        "click",
        function (event) {

            const modal =
                document.getElementById(
                    "messageModal"
                );


            if (event.target === modal) {

                modal.style.display =
                    "none";

            }

        }
    );



    /* =====================================================
       SEARCH
    ===================================================== */

    document.getElementById(
        "searchInput"
    ).addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            if (search === "") {

                displayMessages(
                    allMessages
                );

                return;

            }


            const filtered =
                allMessages.filter(
                    function (message) {

                        return (

                            String(
                                message.name || ""
                            )
                            .toLowerCase()
                            .includes(search)

                            ||

                            String(
                                message.email || ""
                            )
                            .toLowerCase()
                            .includes(search)

                            ||

                            String(
                                message.subject || ""
                            )
                            .toLowerCase()
                            .includes(search)

                            ||

                            String(
                                message.message || ""
                            )
                            .toLowerCase()
                            .includes(search)

                        );

                    }
                );


            displayMessages(filtered);

        }
    );



    /* =====================================================
       REFRESH
    ===================================================== */

    document.getElementById(
        "refreshBtn"
    ).addEventListener(
        "click",
        function () {

            loadMessages();

        }
    );



    /* =====================================================
       SECURITY HELPER
    ===================================================== */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }



    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    loadMessages();

</script>


</body>

</html>
